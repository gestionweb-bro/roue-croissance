<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La roue de la croissance - RH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fdf4ff 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand: #0284c7;
      --brand-hover: #0369a1;
      --shadow-soft: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 650px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 1100px;
    }

    @media (min-width: 900px) {
      .main-container {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    /* Conteneur de la Roue */
    .wheel-wrapper {
      position: relative;
      width: min(92vw, 520px);
      height: min(92vw, 520px);
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 15px 30px rgba(15, 23, 42, 0.15));
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      cursor: pointer;
      user-select: none;
    }

    /* Pointeur / Flèche */
    .pointer-container {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 34px solid #0f172a;
      transition: transform 0.05s ease-out;
      transform-origin: top center;
    }

    .pointer.active {
      transform: scale(1.15) rotate(-8deg);
    }

    /* Bouton central TOURNER */
    .wheel-center-button {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18), inset 0 0 0 5px #0284c7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      color: #0f172a;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }

    .wheel-center-button:hover:not(:disabled) {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35), inset 0 0 0 6px #0369a1;
    }

    .wheel-center-button:active:not(:disabled) {
      transform: scale(0.95);
    }

    .wheel-center-button:disabled {
      cursor: not-allowed;
      opacity: 0.9;
    }

    .wheel-center-button svg {
      width: 22px;
      height: 22px;
      fill: #0284c7;
      margin-bottom: 2px;
    }

    /* Panneau latéral */
    .side-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 24px;
      border-radius: 20px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.7);
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
    }

    .items-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
    }

    .challenges-list {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .challenges-list::-webkit-scrollbar {
      width: 6px;
    }
    .challenges-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 6px;
    }

    .challenge-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border-left: 5px solid #cbd5e1;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .challenge-card:hover {
      background: #f1f5f9;
      transform: translateX(2px);
    }

    .card-content strong {
      display: block;
      color: #0f172a;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .card-content p {
      color: #475569;
      font-size: 0.82rem;
      line-height: 1.35;
    }

    /* Fenêtre modale */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-backdrop.open .modal {
      transform: scale(1) translateY(0);
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-tag {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #0284c7;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 14px;
      line-height: 1.25;
    }

    .modal-desc {
      font-size: 1.05rem;
      color: #334155;
      line-height: 1.6;
      background: #f8fafc;
      padding: 16px 20px;
      border-radius: 14px;
      margin-bottom: 24px;
      border: 1px dashed #cbd5e1;
    }

    .btn-close {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-close:hover {
      background: #0369a1;
    }

    canvas#confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Mois de la Santé &amp; Mieux-être RH</div>
    <h1>La roue de la croissance</h1>
    <p class="subtitle">Un petit défi. Une petite réflexion. Un petit pas.</p>
  </header>

  <div class="main-container">
    <div class="wheel-wrapper">
      <div class="pointer-container">
        <div class="pointer" id="pointer"></div>
      </div>
      <canvas id="wheelCanvas" width="900" height="900"></canvas>
      <button class="wheel-center-button" id="spinBtn" title="Faire tourner la roue">
        <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        TOURNER
      </button>
    </div>

    <div class="side-panel">
      <div class="panel-header">
        <h2>Défis du mois</h2>
        <span class="items-count" id="itemsCount">12 défis</span>
      </div>
      <div class="challenges-list" id="challengesList"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="resultModal">
    <div class="modal">
      <div class="modal-tag">✨ Défi du jour sélectionné !</div>
      <h3 class="modal-title" id="modalTitle">Titre du défi</h3>
      <div class="modal-desc" id="modalDesc">Description de l'action à réaliser aujourd'hui.</div>
      <button class="btn-close" id="closeModalBtn">C'est parti !</button>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    // URL Web App Google Apps Script
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzdQYrW5fmuCzjihyO_9hQdDsWUxCg__JBV23KvomjJBPPB78Gn2WajGkEUblMyV1V8fg/exec";

    const challenges = [
      {
        title: "Faites un petit pas",
        desc: "Identifiez un objectif que vous souhaitez atteindre et posez une petite action concrète aujourd’hui pour vous en rapprocher.",
        color: "#97ebd2"
      },
      {
        title: "Une petite victoire",
        desc: "Prenez une minute pour reconnaître un progrès que vous avez réalisé récemment, même s’il vous semble minime.",
        color: "#fde047"
      },
      {
        title: "Demandez de la rétroaction",
        desc: "Demandez à un collègue : « As-tu une suggestion qui pourrait m’aider à m’améliorer? »",
        color: "#c084fc"
      },
      {
        title: "1 problème, 3 solutions",
        desc: "Choisissez un problème et trouvez trois solutions possibles avant d’en sélectionner une.",
        color: "#93c5fd"
      },
      {
        title: "Votre prochain défi",
        desc: "Identifiez quelque chose que vous aimeriez être capable de faire dans six mois. Quel serait le premier petit pas?",
        color: "#fdba74"
      },
      {
        title: "Transformez l'obstacle",
        desc: "Pensez à une difficulté récente. Qu'est-ce que cette situation peut vous apprendre?",
        color: "#fed7aa"
      },
      {
        title: "Encouragez un collègue",
        desc: "Soulignez un effort, une qualité ou un progrès auprès d'un membre de l'équipe.",
        color: "#f472b6"
      },
      {
        title: "Remplacez « Impossible »",
        desc: "Dites plutôt : « Comment pourrais-je aborder la situation sous un autre angle? »",
        color: "#e879f9"
      },
      {
        title: "Partagez votre savoir",
        desc: "Transmettez une astuce, un outil ou une connaissance utile à un collègue.",
        color: "#86efac"
      },
      {
        title: "Apprenez de l'erreur",
        desc: "Repensez à une maladresse récente : quelle leçon précieuse en tirez-vous pour la suite?",
        color: "#fb923c"
      },
      {
        title: "Changez votre perspective",
        desc: "Devant une situation délicate, demandez-vous : « Existe-t-il une autre façon positive de voir ceci? »",
        color: "#fca5a5"
      },
      {
        title: "Sortez de votre zone",
        desc: "Faites une petite chose aujourd'hui que vous avez habituellement tendance à éviter.",
        color: "#fde68a"
      }
    ];

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const pointer = document.getElementById("pointer");
    const modal = document.getElementById("resultModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalDesc = document.getElementById("modalDesc");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const challengesListEl = document.getElementById("challengesList");
    const itemsCountEl = document.getElementById("itemsCount");

    itemsCountEl.textContent = `${challenges.length} défis`;

    challenges.forEach((ch, idx) => {
      const card = document.createElement("div");
      card.className = "challenge-card";
      card.style.borderLeftColor = ch.color;
      card.innerHTML = `
        <div class="card-content">
          <strong>${idx + 1}. ${ch.title}</strong>
          <p>${ch.desc}</p>
        </div>
      `;
      challengesListEl.appendChild(card);
    });

    let currentAngle = 0;
    let isSpinning = false;
    const numSegments = challenges.length;
    const arcSize = (2 * Math.PI) / numSegments;

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 20;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      challenges.forEach((ch, i) => {
        const angle = currentAngle + i * arcSize;

        ctx.beginPath();
        ctx.fillStyle = ch.color;
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
        ctx.lineTo(centerX, centerY);
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#1e293b";
        ctx.font = "bold 23px 'Plus Jakarta Sans', sans-serif";

        let label = ch.title;
        if (label.length > 22) {
          label = label.substring(0, 20) + "…";
        }
        ctx.fillText(label, radius - 45, 8);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = "#0284c7";
      ctx.lineWidth = 8;
      ctx.stroke();
    }

    drawWheel();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick() {
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playVictoryFanfare() {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.45);
      });
    }

    let startAngle = 0;
    let targetAngle = 0;
    let startTime = 0;
    const spinDuration = 5500;
    let lastSegmentIndex = -1;

    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function animateSpin(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const progress = Math.min(elapsed / spinDuration, 1);
      const easedProgress = easeOutQuart(progress);

      currentAngle = startAngle + (targetAngle - startAngle) * easedProgress;
      drawWheel();

      const normalizedAngle = (3 * Math.PI / 2 - currentAngle) % (2 * Math.PI);
      const positiveAngle = normalizedAngle < 0 ? normalizedAngle + 2 * Math.PI : normalizedAngle;
      const activeIdx = Math.floor(positiveAngle / arcSize) % numSegments;

      if (activeIdx !== lastSegmentIndex) {
        lastSegmentIndex = activeIdx;
        pointer.classList.add("active");
        setTimeout(() => pointer.classList.remove("active"), 40);
        playTick();
      }

      if (progress < 1) {
        requestAnimationFrame(animateSpin);
      } else {
        isSpinning = false;
        spinBtn.disabled = false;
        showResult(activeIdx);
      }
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;

      startAngle = currentAngle % (2 * Math.PI);
      const minRounds = 5;
      const extraRounds = Math.random() * 3;
      const randomStop = Math.random() * 2 * Math.PI;
      targetAngle = startAngle + (minRounds + extraRounds) * 2 * Math.PI + randomStop;
      startTime = 0;
      requestAnimationFrame(animateSpin);
    }

    spinBtn.addEventListener("click", spin);
    canvas.addEventListener("click", spin);

    function showResult(index) {
      const winner = challenges[index];
      modalTitle.textContent = winner.title;
      modalDesc.textContent = winner.desc;
      modal.classList.add("open");
      playVictoryFanfare();
      launchConfetti();

      // Envoi direct vers Google Sheets
      if (GOOGLE_SHEET_URL) {
        fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            challengeTitle: winner.title,
            challengeIndex: index + 1
          })
        }).catch(err => console.log("Erreur télémétrie:", err));
      }
    }

    closeModalBtn.addEventListener("click", () => {
      modal.classList.remove("open");
    });

    const confCanvas = document.getElementById("confettiCanvas");
    const confCtx = confCanvas.getContext("2d");
    let confettiParticles = [];

    function resizeConfettiCanvas() {
      confCanvas.width = window.innerWidth;
      confCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeConfettiCanvas);
    resizeConfettiCanvas();

    function launchConfetti() {
      confettiParticles = [];
      const colors = ["#0284c7", "#f43f5e", "#10b981", "#fbbf24", "#a855f7"];
      for (let i = 0; i < 90; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          w: Math.random() * 9 + 4,
          h: Math.random() * 9 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.7) * 18,
          gravity: 0.35,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10
        });
      }
      renderConfetti();
    }

    function renderConfetti() {
      confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
      let activeCount = 0;

      confettiParticles.forEach(p => {
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotSpeed;

        if (p.y < confCanvas.height) {
          activeCount++;
          confCtx.save();
          confCtx.translate(p.x, p.y);
          confCtx.rotate((p.rotation * Math.PI) / 180);
          confCtx.fillStyle = p.color;
          confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          confCtx.restore();
        }
      });

      if (activeCount > 0) {
        requestAnimationFrame(renderConfetti);
      } else {
        confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
      }
    }
  </script>
</body>
</html>
